<!doctype html>
<html>
<head>
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    .row { margin-bottom: 14px; }
    .hint { font-size: 12px; opacity: .7; margin-top: 4px; }
    #readings { font-size: 13px; line-height: 1.6; }
    #status { margin-top: 8px; font-size: 13px; }
  </style>
</head>
<body>
  <h1 class="homey-title" data-i18n="title"></h1>
  <p class="homey-subtitle" id="intro"></p>

  <fieldset class="homey-form-fieldset">
    <div class="row homey-form-group">
      <label class="homey-form-label" for="solar" id="l_solar"></label>
      <select class="homey-form-select" id="solar"></select>
    </div>
    <div class="row homey-form-group">
      <label class="homey-form-label" for="battery" id="l_battery"></label>
      <select class="homey-form-select" id="battery"></select>
    </div>
    <div class="row homey-form-group">
      <label class="homey-form-label" for="ev" id="l_ev"></label>
      <select class="homey-form-select" id="ev"></select>
    </div>
    <div class="row homey-form-group">
      <label class="homey-form-label" for="linky" id="l_linky"></label>
      <select class="homey-form-select" id="linky"></select>
      <div class="hint" id="h_linky"></div>
    </div>
  </fieldset>

  <button class="homey-button-primary-full" id="save"></button>
  <div id="status"></div>

  <h2 class="homey-subtitle" id="t_readings" style="margin-top:20px"></h2>
  <div id="readings"></div>

  <script>
    const TXT = {
      en: {
        intro: 'Devices the water heater strategy reads. Leave a role empty to disable the rules that use it.',
        solar: 'Solar production (power)', battery: 'Home battery (charge level)', ev: 'EV charger (charging state)',
        linky: 'Linky meter (Tempo colour and HP/HC)', h_linky: 'Lixee/Linky device exposing the Tempo colour and the tariff period.',
        none: '— none —', save: 'Save', saved: 'Saved.', readings: 'Current readings',
        solarW: 'Solar production', batteryPct: 'Battery', evCharging: 'Car charging', period: 'Tariff period', today: 'Tempo today', tomorrow: 'Tempo tomorrow',
        yes: 'yes', no: 'no',
      },
      fr: {
        intro: "Appareils lus par la stratégie du chauffe-eau. Laissez un rôle vide pour désactiver les règles qui l'utilisent.",
        solar: 'Production solaire (puissance)', battery: 'Batterie domestique (niveau de charge)', ev: 'Borne de recharge (état de charge)',
        linky: 'Compteur Linky (couleur Tempo et HP/HC)', h_linky: 'Appareil Lixee/Linky qui expose la couleur Tempo et la période tarifaire.',
        none: '— aucun —', save: 'Enregistrer', saved: 'Enregistré.', readings: 'Valeurs actuelles',
        solarW: 'Production solaire', batteryPct: 'Batterie', evCharging: 'Voiture en charge', period: 'Période tarifaire', today: "Tempo aujourd'hui", tomorrow: 'Tempo demain',
        yes: 'oui', no: 'non',
      },
    };
    let L = TXT.en;

    function onHomeyReady(Homey) {
      const lang = navigator.language || 'en';
      L = String(lang).startsWith('fr') ? TXT.fr : TXT.en;
      document.querySelector('.homey-title').textContent = 'Ariston Nuos';
      document.getElementById('intro').textContent = L.intro;
      for (const r of ['solar', 'battery', 'ev', 'linky']) document.getElementById(`l_${r}`).textContent = L[r];
      document.getElementById('h_linky').textContent = L.h_linky;
      document.getElementById('save').textContent = L.save;
      document.getElementById('t_readings').textContent = L.readings;

      const show = (r) => {
        const el = document.getElementById('readings');
        if (!r) { el.textContent = ''; return; }
        if (r.error) { el.textContent = r.error; return; }
        const t = r.tariff || {};
        const fmt = (v, u) => (v === null || v === undefined ? '—' : `${v}${u || ''}`);
        el.innerHTML = [
          `${L.solarW} : ${fmt(r.solarW, ' W')}`,
          `${L.batteryPct} : ${fmt(r.batteryPct, ' %')}`,
          `${L.evCharging} : ${r.evCharging ? L.yes : L.no}`,
          `${L.period} : ${fmt(t.period)}`,
          `${L.today} : ${fmt(t.today)}`,
          `${L.tomorrow} : ${fmt(t.tomorrow)}`,
        ].join('<br>');
      };

      Homey.api('GET', '/sources', null, (err, res) => {
        if (err) { document.getElementById('status').textContent = err.message || String(err); return Homey.ready(); }
        for (const role of ['solar', 'battery', 'ev', 'linky']) {
          const sel = document.getElementById(role);
          sel.innerHTML = '';
          const none = document.createElement('option');
          none.value = ''; none.textContent = L.none; sel.appendChild(none);
          for (const d of res.candidates[role] || []) {
            const o = document.createElement('option');
            o.value = d.id; o.textContent = d.name; sel.appendChild(o);
          }
          sel.value = res.selected[role] || '';
        }
        show(res.readings);
        Homey.ready();
      });

      document.getElementById('save').addEventListener('click', () => {
        const body = {};
        for (const role of ['solar', 'battery', 'ev', 'linky']) body[role] = document.getElementById(role).value;
        Homey.api('PUT', '/sources', body, (err, readings) => {
          document.getElementById('status').textContent = err ? (err.message || String(err)) : L.saved;
          if (!err) show(readings);
        });
      });
    }
  </script>
</body>
</html>
