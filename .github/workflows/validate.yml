name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tests
        run: node --test test/*.test.js
      - name: Validate the app
        working-directory: com.pepane13.ariston
        run: |
          npm install --global homey@latest --no-audit --no-fund
          homey app validate --level publish
